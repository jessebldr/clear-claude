name: CI

# What this workflow does, precisely. The marketplace holds two independent plugins:
#   - `validate` runs this repository's own consistency check (scripts/check-repo.mjs:
#     versions agree, the recorded prompt hash is current, plugin names are canonical,
#     Markdown links resolve), then Claude Code's manifest and component validator in
#     strict mode over the marketplace and both plugins, clear-partner and clear-ui.
#   - `clear-ui` runs that plugin's test suite, a demo render and a timing bench on
#     Linux, macOS and Windows. clear-partner is a prompt and two skills, so it has no
#     tests to run here.
#   - `clear-transcript` is experimental and outside the marketplace, but it is code: its pure
#     core is tested with plain Node on all three platforms, and `validate` checks its manifest
#     and runs its hooks in Claude Code's own test host. Function hooks are gated; the gate is
#     set for that one command and nowhere else.
#
# What it does NOT do, and why:
#   - It does not run the behavioural eval suite. `claude plugin eval` spawns real
#     `claude` child processes against a real credential and bills real money
#     (see docs/evals.md). Evals are run by hand before a release, not per push.
#   - It does not check the output style. Claude Code does not validate output
#     styles at all — a typo in `force-for-plugin` validates clean and fails
#     silently at runtime (docs/architecture.md, "The validation gap"). A green
#     run here is necessary evidence, not sufficient evidence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Ours, and first because it needs nothing installed: the facts this repository states
      # in more than one place (versions, the prompt's SHA-256, the plugin ids in every
      # install command) and every relative Markdown link.
      - name: Repository consistency
        run: node scripts/check-repo.mjs

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Report Claude Code version
        run: claude --version

      # --strict turns warnings into a non-zero exit, so unrecognized fields and
      # missing metadata fail the build rather than being tolerated at runtime.
      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Validate clear-partner manifest
        run: claude plugin validate plugins/clear-partner --strict

      - name: Validate clear-partner skills
        run: claude plugin validate plugins/clear-partner/skills --strict

      - name: Validate clear-ui manifest and components
        run: |
          claude plugin validate plugins/clear-ui --strict
          claude plugin validate plugins/clear-ui/skills --strict

      # Needs no gate: the validator reads the hooks module's source and prints every event it
      # hooks and every $ call it makes. Both lists are compared whole, so the promise in
      # docs/clear-transcript.md is an allowlist: ui.render on three rows, one command, and no
      # file, network, process, prompt or tool.call access. A new hook or call fails here until
      # this list, and that page, say so.
      - name: Validate clear-transcript, and what it may touch
        run: |
          claude plugin validate experimental/clear-transcript --strict | tee validate.txt
          hooks="$(sed -n 's/^.*register\.js hooks: //p' validate.txt)"
          calls="$(sed -n 's/^.*register\.js calls: //p' validate.txt)"
          echo "hooks: $hooks"; echo "calls: $calls"
          [ "$hooks" = 'session.start, command.run{command=clear-transcript}, ui.render{component=UserMessage, surface=terminal}, ui.render{component=AssistantMessage, surface=terminal}, ui.render{component=ToolGroup, surface=terminal}' ]
          [ "$calls" = '$.command.register, $.ui.invalidate, $.ui.resolve' ]

      # The plugin loaded by the engine's own host, every tree through the terminal surface's
      # real validator. No credential and no model: the tests seat their own stand-in for core.
      # The gate is an environment variable of this one step.
      - name: Test clear-transcript hooks in the engine
        run: claude plugin test experimental/clear-transcript
        env:
          CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: '1'

  # Clear UI is code, so it gets real tests — on all three platforms it claims to support,
  # because its whole cross-platform story is "one Node file, no shell". Golden renders are
  # byte-compared, so a platform-dependent difference fails here rather than in someone's
  # terminal. Node 18 is the floor the plugin advertises; 22 is what CI above uses.
  clear-ui:
    name: clear-ui tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '18'
    defaults:
      run:
        working-directory: plugins/clear-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: zero production dependencies and no build, by design.
      - name: Test
        run: node --test

      # bash on every runner: PowerShell, the Windows default, has no `<` redirection.
      - name: Demo render
        shell: bash
        run: node bin/statusline.mjs < test/fixtures/idle.json
        env:
          COLUMNS: '120'

      # Reports median and p95 beside the per-platform budgets in docs/ui-architecture.md and
      # fails only past the 250 ms hard ceiling: a shared runner is too noisy for the budgets
      # themselves to gate a merge, but the numbers are in the log for every run.
      - name: Bench
        run: node bench/bench.mjs

      # Never fails: it records how long `git status` takes on this runner against the 150 ms
      # the status line allows, which is what decides whether a dirty mark is drawn at all.
      - name: Git latency
        run: node bench/git-latency.mjs .

  # Clear Transcript's decisions are pure functions over plain data, so they are tested with plain
  # Node, on the platforms the other plugin is tested on. `npm test` names its files: the engine
  # suite beside them is TypeScript for `claude plugin test`, which the `validate` job runs.
  clear-transcript:
    name: clear-transcript tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '18'
    defaults:
      run:
        working-directory: experimental/clear-transcript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: zero dependencies and no build, as in clear-ui.
      - name: Test
        run: npm test
